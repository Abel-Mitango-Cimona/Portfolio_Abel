<style>
/* =========================================================
   VARIÁVEIS
========================================================= */
:root{
  --bg:#0A0A0C; --surface:#141317; --surface-2:#1B1A1F;
  --ink:#F4F3EF; --muted:#9C9BA3; --line:#232228;
  --accent:#3D7FFF; --accent-strong:#5C93FF; --accent-dim:rgba(61,127,255,.14);
  --btn-light-bg:#FFFFFF; --btn-light-ink:#0A0A0C;
  --btn-dark-bg:#1B1A1F; --btn-dark-ink:#F4F3EF;
  --radius-lg:28px; --radius-md:14px; --radius-pill:999px;
  --bg-shift:0px;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#F7F6F1; --surface:#FFFFFF; --surface-2:#F0EEE7;
  --ink:#15151A; --muted:#6B6A72; --line:#E4E1D8;
  --accent:#2A5FE0; --accent-strong:#1E4FC8; --accent-dim:rgba(42,95,224,.10);
  --btn-light-bg:#15151A; --btn-light-ink:#F7F6F1;
  --btn-dark-bg:#FFFFFF; --btn-dark-ink:#15151A;
  color-scheme:light;
}

/* =========================================================
   RESET
========================================================= */
*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
body{
  background:
    radial-gradient(circle at 15% 5%, rgba(61,127,255,.12), transparent 35%),
    radial-gradient(circle at 90% 18%, rgba(92,147,255,.08), transparent 30%),
    linear-gradient(180deg, #07080D, #090A12 45%, #0B0D16 100%);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  position:relative;
  transition:background-color .3s ease, color .3s ease;
}

/* BACKGROUND GLOW */
body::before, body::after{
  content:""; position:fixed; pointer-events:none; z-index:-2;
  border-radius:50%; transform:translate3d(0,0,0); will-change:transform;
  transition:opacity .3s ease;
}
body::before{
  top:-140px; left:-120px; width:520px; height:520px;
  background:radial-gradient(circle, rgba(61,127,255,.65) 0%, rgba(61,127,255,.30) 35%, transparent 75%);
  filter:blur(130px); opacity:.8;
  transform:translate3d(0, calc(var(--bg-shift) * -1), 0);
}
body::after{
  top:140px; right:-120px; width:420px; height:420px;
  background:radial-gradient(circle, rgba(92,147,255,.45) 0%, rgba(92,147,255,.18) 40%, transparent 75%);
  filter:blur(110px); opacity:.65;
  transform:translate3d(0, calc(var(--bg-shift) * -.5), 0);
}
html[data-theme="light"] body{
  background:
    radial-gradient(circle at 15% 5%, rgba(42,95,224,.10), transparent 35%),
    linear-gradient(180deg, #F7F8FC, #F7F6F1);
}
html[data-theme="light"] body::before{ opacity:.20; }
html[data-theme="light"] body::after{ opacity:.14; }

a{ color:inherit; }
img{ max-width:100%; display:block; }
::selection{ background:var(--accent); color:#fff; }
h1,h2,h3{ font-family:'Space Grotesk',sans-serif; letter-spacing:-.01em; }

/* =========================================================
   REVEAL — DESKTOP + CELULAR
========================================================= */
.reveal{
  opacity:0;
  transform:translate3d(0,55px,0) scale(.98);
  transition:opacity .85s cubic-bezier(.16,1,.3,1), transform .85s cubic-bezier(.16,1,.3,1);
  will-change:opacity, transform;
}
.reveal.active{
  opacity:1;
  transform:translate3d(0,0,0) scale(1);
}

/* DELAYS */
.card-grid .reveal:nth-child(1), .values-grid .reveal:nth-child(1){ transition-delay:.05s; }
.card-grid .reveal:nth-child(2), .values-grid .reveal:nth-child(2){ transition-delay:.12s; }
.card-grid .reveal:nth-child(3), .values-grid .reveal:nth-child(3){ transition-delay:.19s; }
.card-grid .reveal:nth-child(4), .values-grid .reveal:nth-child(4){ transition-delay:.26s; }

/* =========================================================
   LETTER REVEAL
========================================================= */
.letters .word{ display:inline-block; }
.letters .letter{
  display:inline-block;
  opacity:0;
  transform:translateY(0.45em) rotate(6deg);
  transition:opacity .5s cubic-bezier(0.16,1,0.3,1), transform .5s cubic-bezier(0.16,1,0.3,1);
}
.letters.active .letter{ opacity:1; transform:translateY(0) rotate(0deg); }
@media (prefers-reduced-motion: reduce){
  .letters .letter{ opacity:1; transform:none; transition:none; }
}

/* =========================================================
   NAV
========================================================= */
nav{
  position:fixed; top:0; left:0; right:0; z-index:60;
  display:flex; align-items:center; justify-content:space-between;
  padding:1.1rem clamp(1.2rem,4vw,3rem);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  transition:background-color .3s ease, border-color .3s ease;
}
.logo{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.05rem; text-decoration:none; display:flex; align-items:center; gap:.35rem; }
.logo .dot{ color:var(--accent); }
.nav-center{ display:flex; align-items:center; gap:.3rem; }

  font-size:.78rem; font-weight:500; letter-spacing:.04em; text-transform:uppercase;
